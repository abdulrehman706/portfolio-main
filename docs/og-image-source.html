<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        background: #eef6f2;
        font-family: "Archivo", sans-serif;
        position: relative;
        overflow: hidden;
      }
      .coral {
        position: absolute;
        width: 1200px;
        height: 72px;
        background: #10b981;
        left: 0;
        top: 558px;
      }
      .acid-block {
        position: absolute;
        width: 132px;
        height: 132px;
        background: #a7f3d0;
        right: 132px;
        top: 88px;
      }
      .ink-block {
        position: absolute;
        width: 132px;
        height: 132px;
        background: #1a1a1a;
        right: 96px;
        top: 124px;
      }
      .dot {
        width: 30px;
        height: 30px;
        background: #10b981;
        position: absolute;
        left: 96px;
        top: 98px;
      }
      .role {
        position: absolute;
        left: 142px;
        top: 94px;
        font-weight: 800;
        font-size: 27px;
        letter-spacing: 0.02em;
        color: #1a1a1a;
      }
      h1 {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        font-size: 132px;
        letter-spacing: -0.015em;
        color: #1a1a1a;
        position: absolute;
        left: 92px;
        top: 255px;
        text-transform: uppercase;
        line-height: 0.9;
      }
      h1 span {
        color: #10b981;
      }
      .tag {
        position: absolute;
        left: 96px;
        top: 428px;
        font-size: 28px;
        font-weight: 600;
        color: #4f4f4f;
        max-width: 900px;
        line-height: 1.4;
      }
      .foot {
        position: absolute;
        left: 96px;
        top: 576px;
        font-family: "Anton", sans-serif;
        font-size: 24px;
        letter-spacing: 0.05em;
        color: #1a1a1a;
        text-transform: uppercase;
      }
      .foot span {
        color: #ecfdf5;
      }
    </style>
  </head>
  <body>
    <div class="coral"></div>
    <div class="dot"></div>
    <div class="role">BACKEND &amp; AI ENGINEER</div>
    <h1>Abdul <span>Rehman.</span></h1>
    <div class="tag">
      Production APIs, data pipelines, knowledge graphs, AI agents, and real-time conversational AI.
    </div>
    <div class="acid-block"></div>
    <div class="ink-block"></div>
    <div class="foot"><span>abdulrehmandev.me</span></div>
  </body>
</html>
